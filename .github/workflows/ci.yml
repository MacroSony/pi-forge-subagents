name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Release gate: tests and the packed smoke use the published Forge and runtime
# floors declared in package.json (no moving pi-forge main checkout).
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  compatibility-host:
    name: Packed real chain (Pi 0.87.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Packed install against the Pi 0.87.0 host
        env:
          PI_TEST_VERSION: "0.87.0"
          TYPEBOX_TEST_VERSION: "1.3.7"
        run: npm run check:packed
