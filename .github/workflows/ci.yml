name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        working-directory: pi-forge-subagents
    steps:
      - name: Check out pi-forge-subagents
        uses: actions/checkout@v4
        with:
          path: pi-forge-subagents
      - name: Check out matching pi-forge host
        uses: actions/checkout@v4
        with:
          repository: MacroSony/pi-forge
          ref: main
          path: pi-forge
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: pi-forge-subagents/package-lock.json
      - run: npm ci
      - run: npm run verify
